name: ResoFit production browser smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/production-smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-browser-smoke-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7