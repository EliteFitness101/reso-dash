<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0D0D0D">
  <title>ResoFlex — Offline</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0d0d0d;color:#f5f5f5}
    body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;box-sizing:border-box}
    main{max-width:34rem;text-align:center}
    h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1.05;margin:0 0 1rem}
    p{line-height:1.65;color:#b9b9b9}
    button{margin-top:1rem;border:0;background:#d8b45a;color:#111;padding:.85rem 1.2rem;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <p>RESOFLEX OS</p>
    <h1>You’re offline.</h1>
    <p>Your connection is unavailable. Sensitive account data, profile records, payments, and live content are not stored for offline use. Reconnect to continue securely.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
